repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  # The project's own tool versions, from uv.lock: no second pin to drift.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run bandit -r src/ -c pyproject.toml -q
        language: system
        types: [python]
        pass_filenames: false
      - id: knip
        name: knip (unused scripts and exports in the pages)
        entry: npx knip
        language: system
        files: ^src/gamemaster_mcp/ui/.*\.js$
        pass_filenames: false
