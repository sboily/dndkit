# A tag v<version>, made by `scripts/release.py prepare`, releases that version:
# PyPI and the Docker image (ghcr.io, amd64 and arm64), then a GitHub release
# whose notes are the version's changelog section, with the built files
# attached. The tag must match pyproject.toml, sit on
# main, and have its changelog section; the tests must pass. PyPI trusts this
# workflow (trusted publishing: no token). The build runs apart from the jobs
# that may publish. Actions are pinned by commit; the comment names the release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main's history, to check the tag sits on it
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: The tag is this version, on main, with its changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(uv version --short)"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          uv run --no-project python scripts/release.py notes "$version" > release-notes.md
      - name: Test
        run: |
          uv sync --locked --extra dev
          uv run pytest -q
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            release-notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dndkit/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Publish
        run: uv publish --trusted-publishing always dist/*

  image:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io/<owner>/dndkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github:
    needs: [pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "dndkit ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
