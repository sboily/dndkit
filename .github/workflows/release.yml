# A tag v<version> publishes that version to PyPI, once the tag matches
# pyproject.toml and the tests pass. Trusted publishing: no token, PyPI trusts
# this workflow (pypi.org, dndkit, Publishing). The build runs apart from the
# job that may publish. Actions are pinned by commit; the comment names the
# release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: The tag is the version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - name: Test
        run: |
          uv sync --locked --extra dev
          uv run pytest -q
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dndkit/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Publish
        run: uv publish --trusted-publishing always
