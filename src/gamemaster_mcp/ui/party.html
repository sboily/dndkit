<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Party board</title>
    <!--gm:shared-->
    <style>
      .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .facts { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 10px; }
      .facts span b { color: var(--text); font-weight: 600; }
      .banner { margin-bottom: 10px; padding: 6px 10px; border-radius: 8px; color: var(--gold-hi);
        background: color-mix(in srgb, var(--red) 18%, transparent); border: 1px solid color-mix(in srgb, var(--red) 45%, transparent); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
      .pc { background: var(--card-2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
      .pc.down { box-shadow: inset 0 0 0 1px var(--red); }
      .pc .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
      .pc .top b { font-family: var(--serif); font-size: 15px; }
      .section { margin-top: 12px; }
      .section h4 { margin: 0 0 6px; font: 600 12px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
      .quest { display: grid; grid-template-columns: 1fr 90px; gap: 8px; align-items: center; padding: 3px 0; }
      .quest .bar { height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; }
      .quest .bar i { display: block; height: 100%; background: var(--gold); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="head"><span class="title" id="campaign">🛡</span><span class="muted small" id="session"></span></div>
      <div class="facts muted small" id="facts"></div>
      <div id="banner"></div>
      <div class="grid" id="party"></div>
      <div class="section"><h4 id="questsTitle"></h4><div id="quests"></div></div>
    </div>
    <div id="status"></div>
    <script>
      const { h, fill, t } = GM;

      function character(c) {
        const down = c.hp === 0;
        return h(
          "div",
          { class: "pc" + (down ? " down" : "") },
          h("div", { class: "top" }, h("b", {}, c.name), h("span", { class: "muted small" }, `${t("ac")} ${c.ac}`)),
          h("div", { class: "muted small" }, c.summary),
          GM.hpBar(c.hp, c.hp_max, c.temp),
          down ? h("div", { class: "small" }, `${t("deathSaves")} `, GM.pips(c.death_saves[0], 3, "good"), " ",
            GM.pips(c.death_saves[1], 3, "bad")) : null,
          c.slots.length ? h("div", { class: "small muted" }, c.slots.map(([level, left, max]) =>
            h("span", { style: "margin-right:8px" }, `${t("lvl")} ${level} `, GM.pips(left, max)))) : null,
          GM.conditions(c.conditions, c.exhaustion),
        );
      }

      function quest(q) {
        const ratio = q.total ? q.done / q.total : 0;
        return h("div", { class: "quest" }, h("span", {}, q.title),
          h("div", { class: "bar", title: `${q.done}/${q.total}` }, h("i", { style: `width:${ratio * 100}%` })));
      }

      function render(data) {
        document.getElementById("campaign").textContent = data.campaign;
        document.getElementById("session").textContent = `${t("session")} ${data.session}`;
        const facts = [["📍", data.location], ["📅", data.date], [t("funds"), data.funds]]
          .filter(([, value]) => value)
          .map(([label, value]) => h("span", {}, `${label} `, h("b", {}, value)));
        fill(document.getElementById("facts"), facts);
        fill(document.getElementById("banner"), data.in_combat
          ? h("div", { class: "banner" }, `⚔ ${t("inCombat")} — ${t("round")} ${data.round}` +
              (data.current ? ` — ${t("turnOf", { name: data.current })}` : ""))
          : null);
        fill(document.getElementById("party"),
          data.characters.length ? data.characters.map(character) : h("div", { class: "empty" }, t("noParty")));
        document.getElementById("questsTitle").textContent = t("quests");
        fill(document.getElementById("quests"),
          data.quests.length ? data.quests.map(quest) : h("div", { class: "empty small" }, t("noQuest")));
        GM.fit();
      }

      GM.start(() => GM.live("party", null, render, 2500));
    </script>
  </body>
</html>
