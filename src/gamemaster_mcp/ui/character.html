<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Character sheet</title>
    <!--gm:shared-->
    <style>
      .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .stats { display: flex; gap: 8px; margin: 10px 0; }
      .stat { flex: 1; background: var(--card-2); border-radius: 10px; padding: 6px 8px; text-align: center; }
      .stat b { display: block; font: 700 18px var(--serif); }
      .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
      .abilities { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0; }
      .ability { background: var(--card-2); border-radius: 10px; padding: 6px 2px; text-align: center; }
      .ability .key { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
      .ability .mod { font: 700 18px var(--serif); color: var(--gold-hi); }
      .ability .score { font-size: 11px; color: var(--muted); }
      .section { margin-top: 10px; }
      .section h4 { margin: 0 0 5px; font: 600 11px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
      .xp { height: 5px; background: var(--card-2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
      .xp i { display: block; height: 100%; background: var(--gold); }
      .list { display: flex; flex-wrap: wrap; gap: 4px; }
    </style>
  </head>
  <body>
    <div class="card" id="sheet"><div class="empty">…</div></div>
    <div id="status"></div>
    <script>
      const { h, fill, t } = GM;
      const signed = (n) => (n >= 0 ? `+${n}` : `${n}`);
      const section = (title, ...content) => h("div", { class: "section" }, h("h4", {}, title), ...content);

      function render(c) {
        const stats = [[t("ac"), c.ac], [t("proficiency"), signed(c.proficiency)], [t("xp"), c.xp]];
        const xpRatio = c.next_level_xp ? Math.min(1, c.xp / c.next_level_xp) : 1;
        const spellsByLevel = c.spells.map((s) =>
          h("span", { class: "chip" + (s.prepared ? " warn" : "") },
            `${s.name} · ${s.level === 0 ? t("cantrip") : `${t("level")} ${s.level}`}`));
        fill(document.getElementById("sheet"),
          h("div", { class: "head" },
            h("span", { class: "title" }, c.inspiration ? `${c.name} ★` : c.name),
            h("span", { class: "muted small" }, c.summary + (c.player ? ` — ${c.player}` : ""))),
          h("div", { style: "margin-top:8px" }, GM.hpBar(c.hp, c.hp_max, c.temp)),
          c.hp === 0 ? h("div", { class: "small", style: "margin-top:6px" }, `${t("deathSaves")} `,
            GM.pips(c.death_saves[0], 3, "good"), " ", GM.pips(c.death_saves[1], 3, "bad")) : null,
          h("div", { class: "stats" }, stats.map(([label, value]) => h("div", { class: "stat" }, h("b", {}, value), h("span", {}, label)))),
          c.next_level_xp ? h("div", { class: "muted small" }, `${t("nextLevel")}: ${c.next_level_xp} ${t("xp")}`,
            h("div", { class: "xp" }, h("i", { style: `width:${xpRatio * 100}%` }))) : null,
          h("div", { class: "abilities" }, c.abilities.map((a) => h("div", { class: "ability" },
            h("div", { class: "key" }, t(a.key)), h("div", { class: "mod" }, signed(a.mod)), h("div", { class: "score" }, a.score)))),
          GM.conditions(c.conditions, c.exhaustion),
          c.slots.length ? section(t("slots"), h("div", { class: "list" }, c.slots.map(([level, left, max]) =>
            h("span", { style: "margin-right:10px" }, `${t("lvl")} ${level} `, GM.pips(left, max))))) : null,
          c.spells.length ? section(t("spells"), h("div", { class: "list" }, spellsByLevel)) : null,
          c.inventory.length ? section(t("inventory"), h("div", { class: "list" },
            c.inventory.map((i) => h("span", { class: "chip" }, i.qty > 1 ? `${i.name} ×${i.qty}` : i.name)))) : null,
        );
        GM.fit();
      }

      GM.start(async () => {
        const args = await GM.toolInput();
        const name = args.name_or_id;
        if (!name) return GM.status("?");
        GM.live("character", { name }, render, 2500);
      });
    </script>
  </body>
</html>
