[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gamemaster-mcp"
version = "0.4.0"
description = "A D&D 5e campaign management MCP server, built for voice game masters"
authors = [{ name = "Joel Casimir", email = "y9agf5y5@anonaddy.me" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0,<5",
    "platformdirs>=4.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "segno>=1.6",
    "shortuuid>=1.0.13",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.urls]
Homepage = "https://github.com/sboily/gamemaster-mcp"
Upstream = "https://github.com/study-flamingo/gamemaster-mcp"

[project.optional-dependencies]
dev = [
    "bandit>=1.8",
    "httpx>=0.28",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.11",
    "types-pyyaml>=6.0",
]

[project.scripts]
gamemaster-mcp = "gamemaster_mcp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gamemaster_mcp.ui" = ["*.html", "*.css", "*.js"]
# Skill files (Markdown only so far: widen this when a skill ships scripts or assets).
"gamemaster_mcp.skills" = ["*/*.md", "*/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastMCP injects these defaults per call; they are markers, not shared state.
extend-immutable-calls = [
    "fastmcp.dependencies.CurrentContext",
    "fastmcp.dependencies.Depends",
]

[tool.ruff.lint.isort]
known-first-party = ["gamemaster_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["shortuuid.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
